<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1e1e1e; color: #d4d4d4; padding: 15px; margin: 0; width: 400px; }
        .search-container { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex-grow: 1; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        button { padding: 8px 12px; background: #0e639c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1177bb; }
        #copy-btn { background: #444; width: 100%; margin-bottom: 15px; }
        .card { background: #252526; padding: 15px; margin-bottom: 15px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h3 { margin-top: 0; color: #4ec9b0; font-size: 15px; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px;}
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .label { font-weight: bold; color: #9cdcfe; }
        .val { color: #ce9178; text-align: right; max-width: 65%; word-wrap: break-word; }
        .alert { color: #f44336; font-weight: bold; }
        .clean { color: #4CAF50; font-weight: bold; }
        #status-msg { color: #f1d592; font-size: 12px; text-align: center; margin-bottom: 10px; }
        
        /* Pivot Buttons Styling */
        .pivot-container { display: flex; gap: 5px; justify-content: space-between; margin-top: 15px; }
        .pivot-btn { padding: 8px; background: #333; border: 1px solid #555; font-size: 11px; flex-grow: 1; font-weight: normal;}
        .pivot-btn:hover { background: #555; }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" id="ioc-input" placeholder="IP, Domain, URL, or Hash...">
        <button id="search-btn">Analyze</button>
    </div>
    
    <button id="copy-btn">📋 Copy Report (Defanged)</button>
    <div id="status-msg"></div>

    <div class="card" id="vt-card" style="display: none;">
        <h3>VirusTotal Intelligence</h3>
        <div class="row"><span class="label">Detection Ratio:</span> <span class="val" id="vt-score">-</span></div>
        <div class="row" id="vt-extra-1"></div>
        <div class="row" id="vt-extra-2"></div>
        <div class="row" id="vt-extra-3"></div>
    </div>

    <!-- Shodan Card -->
    <div class="card" id="shodan-card" style="display: none;">
        <h3>Shodan Infrastructure</h3>
        <div class="row"><span class="label">Organization:</span> <span class="val" id="sho-org">-</span></div>
        <div class="row"><span class="label">Open Ports:</span> <span class="val" id="sho-ports">-</span></div>
        <div class="row"><span class="label">CVE Vulns:</span> <span class="val" id="sho-vulns">-</span></div>
    </div>

    <div class="card" id="abuse-card" style="display: none;">
        <h3>AbuseIPDB Context</h3>
        <div class="row"><span class="label">Confidence Score:</span> <span class="val" id="ab-score">-</span></div>
        <div class="row"><span class="label">Recent Reports:</span> <span class="val" id="ab-reports">-</span></div>
        <div class="row"><span class="label">ISP:</span> <span class="val" id="ab-isp">-</span></div>
        <div class="row"><span class="label">Tor Exit Node:</span> <span class="val" id="ab-tor">-</span></div>
    </div>
    <!-- Triage Sandbox Card -->
    <div class="card" id="triage-card" style="display: none;">

        <h3>Triage Sandbox</h3>

        <div class="row">
            <span class="label">Status:</span>
            <span class="val" id="triage-status">Ready</span>
        </div>

        <div class="row">
            <span class="label">Score:</span>
            <span class="val" id="triage-score">-</span>
        </div>

        <div class="row">
            <span class="label">Tags:</span>
            <span class="val" id="triage-tags">-</span>
        </div>

        <div class="row">
            <span class="label">Sample ID:</span>
            <span class="val" id="triage-id">-</span>
        </div>

        <button
            id="triage-submit-btn"
            style="width:100%; margin-top:10px;">
            ▶ Run URL in Triage Sandbox
        </button>

        <button
            id="triage-open-btn"
            style="width:100%; margin-top:8px; display:none;">
            ↗ Open Full Triage Report
        </button>

        <img
            id="triage-screenshot"
            alt="Triage URL Screenshot"
            style="
                display:none;
                width:100%;
                margin-top:12px;
                border-radius:4px;
                border:1px solid #555;
            "
        >

    </div>

    <!-- Pivot Links -->
    <div class="pivot-container" id="pivot-links" style="display: none;">
        <button class="pivot-btn" id="pivot-vt">↗ VT</button>
        <button class="pivot-btn" id="pivot-ab">↗ AbuseIPDB</button>
        <button class="pivot-btn" id="pivot-sh">↗ Shodan</button>
        <button class="pivot-btn" id="pivot-us">↗ URLScan</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
